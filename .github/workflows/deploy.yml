name: Deploy Frontend

on:
  push:
    branches: [ main, dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set environment variables
        id: vars
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Environment name: ${{ steps.vars.outputs.env_name }}"
          
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "::set-output name=env_name::prod"
            echo "::set-output name=compose_file::docker-compose.prod.yml"
            echo "::set-output name=port::80"
            echo "::set-output name=environment::production"
            echo "::set-output name=base_url::https://drawberry.io"
            echo "::set-output name=api_url::https://api.drawberry.io"
          else
            echo "::set-output name=env_name::dev"
            echo "::set-output name=compose_file::docker-compose.dev.yml"
            echo "::set-output name=port::8081"
            echo "::set-output name=environment::development"
            echo "::set-output name=base_url::https://dev.drawberry.io"
            echo "::set-output name=api_url::https://dev.api.drawberry.io"
          fi
          
          echo "Environment name: ${{ steps.vars.outputs.env_name }}"

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Exit on any error
            set -e
            
            echo "Environment name: ${{ steps.vars.outputs.env_name }}"
            
            ls -l /home/apps/drawberry/drawberry-frontend/${{ steps.vars.outputs.env_name }} 
            
            # Navigate to appropriate directory
            cd /home/apps/drawberry/drawberry-frontend/${{ steps.vars.outputs.env_name }}
            
            pwd
            
            # Pull latest changes
            git pull origin ${{ github.ref_name }}
            
            # Create environment file
            cat > .env << EOF
            PORT=${{ steps.vars.outputs.port }}
            VUE_APP_ENVIRONMENT=${{ steps.vars.outputs.environment }}
            VUE_APP_BASE_URL=${{ steps.vars.outputs.base_url }}
            VUE_APP_BASE_API_URL=${{ steps.vars.outputs.api_url }}
            VUE_APP_GOOGLE_CLIENT_ID=${{ secrets.VUE_APP_GOOGLE_CLIENT_ID }}
            EOF
            
            # Build and restart using appropriate compose file
            docker-compose -f docker-compose.yml -f ${{ steps.vars.outputs.compose_file }} up -d --build
            
            # Clean up old images
            docker image prune -f
            
            echo "Deployment completed successfully!"